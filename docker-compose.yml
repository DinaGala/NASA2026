
services:
  postgres:
    image: postgres:17
    container_name: psi-flame-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: psi_flame
      POSTGRES_USER: flame_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - psi_flame_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flame_user -d psi_flame"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  psi_flame_data:
