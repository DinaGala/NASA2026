[project]
name = "nasa-2026"
version = "0.1.0"
description = "NASA Physical Sciences Informatics combustion studies dashboard"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "httpx",
    "numpy",
    "openpyxl",
    "pandas",
    "plotly",
    "psycopg[binary]",
    "pyarrow",
    "pydantic-ai-slim[anthropic]>=2.68",  # retries={"tools":..,"output":..} form
    "pymupdf",
    "python-docx",
    "python-dotenv",
    "python-pptx",
    "requests>=2.34.2",
    "sentence-transformers",
    "sqlalchemy",
    "streamlit",
    "uvicorn",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
