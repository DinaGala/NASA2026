[project]
name = "nasa-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "httpx",
    "openpyxl",
    "pandas",
    "psycopg[binary]",
    "pyarrow",
    "pymupdf",
    "python-docx",
    "python-dotenv",
    "python-pptx",
    "requests>=2.34.2",
    "sentence-transformers",
    "sqlalchemy",
    "uvicorn",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
